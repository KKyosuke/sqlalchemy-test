services:
  app:
    build:
      context: ./app
    volumes:
      - ./app:/app
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://user:password@db:3306/test_db
      PYTHONPATH: /
    tty: true

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: test_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
